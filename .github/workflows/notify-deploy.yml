name: Notify deploy to Telegram

on:
  check_run:
    types: [completed]

jobs:
  notify:
    if: github.event.check_run.app.name == 'Cloudflare Workers and Pages'
    runs-on: ubuntu-latest
    steps:
      - name: Forward Cloudflare check_run completed to cf-deploy-notifier
        env:
          CONCLUSION: ${{ github.event.check_run.conclusion }}
          CHECK_NAME: ${{ github.event.check_run.name }}
          SHA: ${{ github.event.check_run.head_sha }}
          BRANCH: ${{ github.event.check_run.check_suite.head_branch }}
          REPO: ${{ github.event.repository.name }}
          DETAILS_URL: ${{ github.event.check_run.details_url }}
          CF_WEBHOOK_SECRET: ${{ secrets.CF_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          NAME="${CHECK_NAME} - ${CONCLUSION}"
          PAYLOAD=$(jq -n \
            --arg name "$NAME" \
            --arg text "$CONCLUSION" \
            --arg project "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "$SHA" \
            --arg url "$DETAILS_URL" \
            '{name:$name, text:$text, data:{pages_project_name:$project, branch:$branch, commit_hash:$sha, url:$url}}')
          curl --fail-with-body -sS -X POST \
            "https://cf-deploy-notifier.archie-design.workers.dev" \
            -H "cf-webhook-auth: ${CF_WEBHOOK_SECRET}" \
            -H "content-type: application/json" \
            -d "$PAYLOAD"
